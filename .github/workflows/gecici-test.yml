name: gecici-test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, requests, base64, time, json
          for i,w in enumerate([0,30,30,60,60,90]):
              time.sleep(w); t=time.time()
              rr=requests.get("https://image.pollinations.ai/prompt/flat%20cartoon%20forest%20scene%20"+str(i)+"?width=1080&height=1920&model=flux&nologo=true&seed="+str(i),timeout=120)
              print("POLL wait",w, rr.status_code, len(rr.content), round(time.time()-t,1), rr.text[:250].replace("\n"," ") if rr.status_code!=200 else "")
          PY
